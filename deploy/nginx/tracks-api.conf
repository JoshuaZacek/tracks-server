# nginx on the host in front of tracks-server, behind Cloudflare's proxy (DNS record "Proxied").
# Install once (as root):
#   cp deploy/nginx/tracks-api.conf /etc/nginx/sites-available/tracks-api.conf
#   cp deploy/cloudflare-origin-pull-ca.pem /etc/nginx/cloudflare-origin-pull-ca.pem
#   (edit the certificate paths below), then:
#   ln -s /etc/nginx/sites-available/tracks-api.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# - Certificate: any certificate valid for tracks-api.joshuazacek.com (e.g. certbot's); Cloudflare's
#   SSL/TLS mode "Full (strict)" accepts publicly trusted certificates.
# - Only Cloudflare may connect: with Authenticated Origin Pulls on in Cloudflare, it presents a client
#   certificate from its origin-pull CA; anything else gets 400 "No required SSL certificate was sent".
# - Client IPs: since only Cloudflare connects, CF-Connecting-IP is the visitor's real address; it becomes
#   the only X-Forwarded-For entry the API sees (TRUST_PROXY=1), so rate limits are per visitor.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx 1.25.1+; on older nginx, delete this line and write "listen 443 ssl http2;"
    server_name tracks-api.joshuazacek.com;

    # certbot's files: a certificate for this name, or a wildcard *.joshuazacek.com one.
    ssl_certificate     /etc/letsencrypt/live/tracks-api.joshuazacek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracks-api.joshuazacek.com/privkey.pem;

    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    client_max_body_size 64k;

    # certbot --webroot renewals; Cloudflare's "Always Use HTTPS" may send the HTTP challenge here.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3000;   # API_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tracks-api.joshuazacek.com;
    # certbot's HTTP challenge (certbot certonly --webroot -w /var/www/html -d tracks-api.joshuazacek.com).
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
