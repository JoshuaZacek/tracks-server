# The production stack on one host: a one-shot migration, the API, the worker, and daily
# database backups, using the Postgres in DATABASE_URL.
#
# The API listens on 127.0.0.1:${API_PORT} only, for the host's web server (nginx, see
# deploy/nginx/) to serve over HTTPS. Without a web server of your own, add
# docker-compose.caddy.yml for a bundled Caddy.
#
# By default that's the host's own Postgres over its Unix socket (/var/run/postgresql mounted
# into the containers): nothing listens on the network, and it survives reboots.
#   DATABASE_URL=postgres://<user>:<password>@localhost/tracks?host=/var/run/postgresql
# Without a Postgres of your own, add docker-compose.postgres.yml for a bundled one
# (COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml in .env).
#
# Configuration comes from `.env` next to this file; in production, deploy/write-config.sh
# writes it from GitHub secrets (docs/deploy.md). Try it locally with the bundled Postgres and
# Caddy, and DOMAIN=localhost (Caddy then uses its own local certificate authority).

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

x-app: &app
  build: .
  image: tracks-server:latest
  init: true
  env_file:
    - path: .env
      required: false
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    DATA_DIR: /data
    PORT: '3000'
    TRUST_PROXY: '1' # exactly one proxy (nginx or Caddy) in front: client IPs for rate limits come from X-Forwarded-For
  volumes:
    # The host Postgres's socket directory (DB_SOCKET_DIR); unused with the bundled Postgres.
    - ${DB_SOCKET_DIR:-/var/run/postgresql}:/var/run/postgresql
  logging: *logging

services:
  migrate:
    <<: *app
    command: ['node', 'scripts/migrate.ts']
    restart: 'no'

  api:
    <<: *app
    # Loopback only: reachable from the host's web server, not from outside.
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Graceful shutdown drains requests for up to 10 s.
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    <<: *app
    command: ['node', 'src/worker.ts']
    volumes:
      - ${DB_SOCKET_DIR:-/var/run/postgresql}:/var/run/postgresql
      - data:/data
      # Optional: the APNs .p8 key (set APNS_KEY_PATH=/run/secrets/<file>.p8 in .env).
      - ./secrets:/run/secrets:ro
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Shutdown flushes and commits the Darwin consumer's position; give it time.
    stop_grace_period: 30s
    restart: unless-stopped

  backup:
    # pg_dump/pg_restore 18 handle any older server, whichever Postgres the host runs.
    image: postgres:18
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${DB_SOCKET_DIR:-/var/run/postgresql}:/var/run/postgresql
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    logging: *logging

volumes:
  data:
